name: Tests

on:
  push:
    paths-ignore:
      - "*.md"
    branches-ignore:
      - master
  workflow_call:

# Ensure that multiple runs on the same branch do not overlap.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        nim: ["2.0.x", "2.2.0"]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ matrix.nim }}
          use-nightlies: true
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Project
        run: |
          rm -rf "$HOME/.nimble"
          mkdir -p "$HOME/.nimble"
          nimble install -Y --depsOnly
          nimble build -Y
          test -x ./nitter

      - name: Run API serialization tests
        run: nim c -r tests/test_api_json.nim

      - name: Upload 2.2.0 build artifact
        if: matrix.nim == '2.2.0'
        uses: actions/upload-artifact@v6
        with:
          name: nitter-linux-nim-2.2.0-${{ github.sha }}
          path: |
            ./nitter
          if-no-files-found: error

  integration-test:
    needs: [build-test]
    name: Integration test
    runs-on: ubuntu-24.04

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - name: Install runtime deps
        run: |
          sudo apt-get install -y --no-install-recommends libsass-dev libpcre3

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Cache pipx (poetry)
        uses: actions/cache@v5
        with:
          path: |
            ~/.local/pipx
            ~/.local/bin
          key: pipx-poetry-${{ runner.os }}

      - name: Install poetry
        env:
          PIPX_HOME: ~/.local/pipx
          PIPX_BIN_DIR: ~/.local/bin
        run: command -v poetry >/dev/null 2>&1 || pipx install poetry

      - name: Setup Python (3.14) with Poetry cache
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: poetry
          cache-dependency-path: tests/poetry.lock

      - name: Install Python deps
        working-directory: tests
        run: poetry sync

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: 2.2.0
          use-nightlies: true
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download 2.2.0 build artifact
        uses: actions/download-artifact@v4
        with:
          name: nitter-linux-nim-2.2.0-${{ github.sha }}
          path: .

      - name: Make nitter binary executable
        run: chmod +x ./nitter

      - name: Prepare Nitter Environment
        env:
          SESSIONS: ${{ secrets.SESSIONS }}
        run: |
          cp nitter.example.conf nitter.conf
          sed -i 's/enableDebug = false/enableDebug = true/g' nitter.conf
          sed -i 's/maxRetries = 1/maxRetries = 10/g' nitter.conf

          if [ -z "$SESSIONS" ]; then
            echo "SKIP_INTEGRATION=true" >> "$GITHUB_ENV"
            echo "Skipping integration tests because SESSIONS secret is not configured."
            exit 0
          fi

          rm -rf "$HOME/.nimble"
          mkdir -p "$HOME/.nimble"
          nimble install -Y --depsOnly

          # Run both Nimble tasks concurrently
          nim r tools/rendermd.nim &
          nim r tools/gencss.nim &
          wait

          printf '%s\n' "$SESSIONS" > ./sessions.jsonl

      - name: Run Tests
        if: env.SKIP_INTEGRATION != 'true'
        run: |
          NITTER_ENABLE_API=true ./nitter &
          cd tests
          poetry run pytest -n3 --reruns=5 --rs .
